version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "simongalaxy", email = "simongalaxy2011@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "instructor>=1.17.0",
    "openpyxl>=3.1.5",
